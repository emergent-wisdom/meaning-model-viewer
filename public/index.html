<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story Mind</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="viz-root">
  <header class="top">
    <div class="titles">
      <div class="eyebrow">A world model, built by an agent with the Meaning Model</div>
      <h1 id="title">Story Mind</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <section class="deep" aria-label="Deep time">
    <div class="label-row"><span class="panel-label">Deep time</span><span class="hint">log scale, years before the story</span></div>
    <svg id="deep"></svg>
  </section>

  <main class="middle">
    <section class="lives" aria-label="Lives over story time">
      <div class="label-row">
        <span class="panel-label">Lives</span>
        <span class="zoom" id="zoom">
          <button data-zoom="lives" class="on">Their lives</button>
          <button data-zoom="story">The story</button>
        </span>
        <span class="hint" id="playhead-label"></span>
      </div>
      <div id="lanes"></div>
    </section>
    <section class="mind" aria-label="The mind: understanding and text">
      <div class="label-row"><span class="panel-label">Mind</span><span class="legend" id="mind-legend"></span></div>
      <svg id="mind"></svg>
    </section>
  </main>

  <section class="caption" aria-live="polite">
    <div class="caption-kind" id="caption-kind">What the agent is doing</div>
    <div class="caption-text" id="caption-text"></div>
  </section>

  <footer class="construction" aria-label="Construction">
    <div class="label-row">
      <button id="play" class="play" aria-label="Play the construction">▶</button>
      <span class="panel-label">Construction</span>
      <span class="hint" id="clock"></span>
      <span class="live" id="live" hidden>● live</span>
    </div>
    <svg id="build"></svg>
  </footer>
</div>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<script src="vendor/d3.min.js"></script>
<script src="app.js"></script>
</body>
</html>
