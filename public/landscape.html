<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Landscape</title>
<script>
// The landscape's replay of the construction is the one view's second way to play. A link to the landscape opens the
// view playing the construction, keeping what the link asked for: &play, &read, &live, &still (the camera held free).
const from = new URLSearchParams(location.search); const to = new URLSearchParams();
for (const key of ['data', 'title', 'live', 'read', 'play']) if (from.has(key)) to.set(key, from.get(key));
to.set('mode', 'construction'); if (from.has('still')) to.set('camera', 'free');
location.replace(`./?${to.toString().replace(/=(&|$)/g, '$1')}`);
</script>
</head>
<body style="background:#050608"></body>
</html>
